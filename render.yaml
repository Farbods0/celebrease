services:
  - type: web
    name: celebrease-backend
    env: node
    rootDir: backend
    buildCommand: "pnpm install && pnpm run build"
    startCommand: "pnpm run start:prod"
    envVars:
      - key: DATABASE_URL
        value: "<HIDDEN_DATABASE_URL>"
      - key: NODE_ENV
        value: production
      - key: CLIENT
        value: "https://celebrease.com,https://admin.celebrease.com"
      - key: APP_SERVER
        value: https://celebrease-backend.onrender.com
      - key: FRONTEND_URL
        value: https://celebrease.com
      - key: BETTER_AUTH_SECRET
        value: "eb0c250ae4a9b1cff684b132a0d857faaf7d6bbf0e294cb3be86c3a1b26735e2"
      - key: BETTER_AUTH_URL
        value: https://celebrease.com
      - key: JWT_SECRET
        generateValue: true
