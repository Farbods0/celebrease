services:
  - type: web
    name: celebrease-backend
    env: node
    rootDir: backend
    buildCommand: "pnpm install && pnpm run build"
    startCommand: "pnpm run start:prod"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: celebrease-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://celebrease.com
      - key: APP_SERVER
        value: https://celebrease-backend.onrender.com
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: celebrease-db
    databaseName: celebrease
    user: celebrease_user
